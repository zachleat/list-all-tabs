<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="tabs.css"/>
  <link rel="icon" href="icon.svg" type="image/svg+xml"/>
  <title>List all tabs</title>
</head>

<body>
  <h1><img src="icon.svg" alt="">List all tabs <span class="version"></span></h1>

  <div class="sort">
    <input type="search" id="filter" placeholder="Filter tabs" aria-label="Filter tabs">
    <label>Sort tabs by
      <select id="sort">
        <option value="order">Tab order</option>
        <option value="oldest">Least recently used</option>
        <option value="newest">Most recently used</option>
      </select>
    </label>
    <label><input type="checkbox" id="show-unloaded" data-hides="discarded-tab" data-counted checked> Show unloaded</label>
    <label><input type="checkbox" id="show-pinned" data-hides="pinned-tab"> Show pinned</label>
  </div>

  <details id="important" open hidden>
  <summary><h2>Important <span class="count">(<span data-count-of="li"></span><span data-count-of="li:not(.discarded-tab)" data-count-icon="●" title="Loaded tabs" data-count-hide-same></span><span data-count-of="li.discarded-tab" data-count-icon="○" title="Unloaded tabs" data-count-hide-zero></span>)</span></h2></summary>
  <div class="cards">
    <section id="dupes" class="card">
    <div class="host-header"><h3>Duplicate tabs <span class="count">(<span data-count-of="#dupes-tabs-list li"></span><span data-count-of="#dupes-tabs-list li:not(.discarded-tab)" data-count-icon="●" title="Loaded tabs" data-count-hide-zero data-count-hide-same></span><span data-count-of="#dupes-tabs-list li.discarded-tab" data-count-icon="○" title="Unloaded tabs" data-count-hide-zero></span>)</span></h3></div>
    <div id="dupes-tabs-list" class="tabs-list"></div>
    </section>
    <section id="audio" class="card">
    <div class="host-header"><h3>Playing audio <span class="count">(<span data-count-of="#audio-tabs-list li"></span>)</span></h3></div>
    <div id="audio-tabs-list" class="tabs-list"></div>
    </section>
  </div>
  </details>

  <details id="all-tabs">
  <summary><h2>All tabs <span class="count">(<span data-count-of="#all-tabs-list li" data-count-unit="tab"></span><span data-count-of="#all-tabs-list li:not(.discarded-tab)" data-count-icon="●" title="Loaded tabs" data-count-hide-same></span><span data-count-of="#all-tabs-list li.discarded-tab" data-count-icon="○" title="Unloaded tabs" data-count-hide-zero></span>)</span></h2> <button type="button" class="unload-all"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h7l-7 8h7"/><path d="M12 6h5l-5 6h5"/><path d="M18 2h3l-3 4h3"/></svg>Unload all</button></summary>
  <div id="all-tabs-list" class="tabs-list"></div>
  </details>

  <details id="top-hosts" open>
  <summary><h2>Top hosts <span class="count">(<span data-count-of=".host-group" data-count-unit="host"></span>, <span data-count-of=".host-group li" data-count-unit="tab"></span><span data-count-of=".host-group li:not(.discarded-tab)" data-count-icon="●" title="Loaded tabs" data-count-hide-same></span><span data-count-of=".host-group li.discarded-tab" data-count-icon="○" title="Unloaded tabs" data-count-hide-zero></span>)</span></h2> <button type="button" class="toggle-hosts">Collapse all</button></summary>
  <div id="top-hosts-list"></div>
  </details>

  <details id="saved" open hidden>
  <summary><h2>Saved <span class="count">(<span data-count-of="li" data-count-unit="site"></span>)</span></h2></summary>
  <div id="saved-list" class="cards"></div>
  </details>

  <p class="note">To see CPU and memory use for each tab, open <code>about:processes</code> <button type="button" class="copy-processes" title="Copy" aria-label="Copy about:processes"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg></button> in the address bar.</p>

  <div id="toast" class="toast" role="status" hidden><span class="toast-text"></span> <button type="button" class="toast-action"></button></div>

  <script src="tabs.js"></script>
</body>

</html>
